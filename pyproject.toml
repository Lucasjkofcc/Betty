[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Betty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbus-next>=0.2.3",
    "ddgs>=9.16.0",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "libspotifyctl>=0.3.4",
    "numpy>=2.5.2",
    "ollama>=0.6.3",
    "openai-whisper>=20250625",
    "opencv-python>=5.0.0.93",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "vosk>=0.3.45",
]

[project.scripts]
betty = "betty.main:run"

[tool.setuptools.packages.find]
where = ["src"]
